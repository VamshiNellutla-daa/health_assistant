<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Health Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <div class="container">
            <div class="hero">
                <div>
                    <p class="eyebrow">Health Assistant</p>
                    <h1>Medical symptom analysis powered by LLM</h1>
                    <p class="subtitle">Enter your symptoms below and get possible causes, home care suggestions, specialist recommendations, and a safety disclaimer.</p>
                </div>
            </div>

            <div class="chat-panel">
                <label for="symptomInput" class="input-label">Tell me what you're feeling</label>
                <textarea id="symptomInput" placeholder="Example: Fever, headache, and nausea for two days..."></textarea>
                <p class="disclaimer">This project is a research prototype and not medical advice.</p>
                <button onclick="analyzeSymptoms()" id="btn">Analyze Symptoms</button>

                <div id="loading" class="hidden loading-panel">Processing your request...</div>
                <div id="result" class="result-panel hidden"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
